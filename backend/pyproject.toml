[project]
name = "stackbot-backend"
version = "0.1.0"
description = "StackBot — hybrid BM25 + vector RAG over developer documentation"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # LLM
    "groq>=0.9.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.0.3",
    "langchain-community>=0.2.0",
    "langchain>=0.2.0",
    # Vector store
    "qdrant-client>=1.9.0",
    # Sparse retrieval
    "rank-bm25>=0.2.2",
    # Document loading
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "requests>=2.31.0",
    # Env
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
